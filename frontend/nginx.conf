server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for; # nginx host sudah menambah IP klien di akhir
  }
  # SW jangan pernah di-cache; aset ber-hash cache lama; sisanya SPA fallback.
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
