name: Deploy Catetkos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: env
        run: echo "IMAGE_TAG=main-$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.env.outputs.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:main-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /home/ubuntu/repo/catetkos
            git fetch origin main && git reset --hard origin/main
            IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ steps.env.outputs.IMAGE_TAG }}" ./deploy.sh
