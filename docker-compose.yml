# Dua service terpisah: api (Go) dan web (nginx + Vite build, proxy /api ke api). Postgres di host.
services:
  api:
    build: ./backend
    container_name: ${CONTAINER_NAME:-catetkos-prod}-api
    restart: unless-stopped
    stop_grace_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:?isi DATABASE_URL di .env}
      - SESSION_SECRET=${SESSION_SECRET:?isi SESSION_SECRET di .env}
      - COOKIE_SECURE=1
  web:
    build: ./frontend
    container_name: ${CONTAINER_NAME:-catetkos-prod}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${HOST_PORT:-3005}:80"
